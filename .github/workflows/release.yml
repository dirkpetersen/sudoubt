# Build Linux x86_64 and arm64 binaries and publish a GitHub release.
# Start it with: git tag v0.0.1 && git push origin v0.0.1
# The tag must match Cargo.toml and point to a commit on main.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  draft:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check that the tag matches Cargo.toml and is on main
        run: |
          ver=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "v$ver" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $ver"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --generate-notes

  build:
    needs: draft
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # ubuntu-24.04 links against glibc 2.39, so the binary runs on RHEL 10 and Ubuntu 26.04+
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: Install libacl
        run: sudo apt-get update && sudo apt-get install -y libacl1-dev
      - name: Test
        run: cargo test --locked --release
      - name: Root tests
        run: sudo -E env "PATH=$PATH" cargo test --locked --release --test root -- --test-threads=1
      - name: Build
        run: cargo build --locked --release
      - name: Package
        id: package
        run: |
          name="sudoubt-${GITHUB_REF_NAME#v}-linux-${{ matrix.arch }}"
          mkdir "$name"
          cp target/release/sudoubt README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.package.outputs.name }}.tar.gz
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ steps.package.outputs.name }}
        run: gh release upload "$GITHUB_REF_NAME" "$NAME.tar.gz" "$NAME.tar.gz.sha256"

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
