[package]
name = "sudoubt"
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
description = "sudo with trust issues: a tiny root helper for ProjectVault folder operations"
license = "MIT"
repository = "https://github.com/dirkpetersen/sudoubt"
publish = false

[dependencies]
libc = "0.2.191"
nix = { version = "0.31.3", features = ["fs", "user", "process", "time"] }
posix-acl = "1.2.0"
serde_json = "1.0.154"
xattr = "1.6.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
